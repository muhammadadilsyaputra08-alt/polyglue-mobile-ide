name: Build

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  NDK_VERSION: r26b
  CMAKE_VERSION: 3.22.1

jobs:
  # ── 1. Lint & Detekt ─────────────────────────────────────────────
  lint:
    name: Lint & Detekt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Generate Gradle wrapper jika belum ada
        run: |
          if [ ! -f gradlew ]; then
            echo "gradlew tidak ditemukan, generate otomatis..."
            for i in 1 2 3; do
              gradle wrapper --gradle-version 8.7 && break
              echo "Percobaan $i gagal (kemungkinan services.gradle.org sedang down), retry dalam 15 detik..."
              sleep 15
            done
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Android Lint
        run: ./gradlew lint

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

  # ── 2. Unit Tests ────────────────────────────────────────────────
  test:
    name: Unit Tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Generate Gradle wrapper jika belum ada
        run: |
          if [ ! -f gradlew ]; then
            echo "gradlew tidak ditemukan, generate otomatis..."
            for i in 1 2 3; do
              gradle wrapper --gradle-version 8.7 && break
              echo "Percobaan $i gagal (kemungkinan services.gradle.org sedang down), retry dalam 15 detik..."
              sleep 15
            done
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/

  # ── 3. Build Debug APK ───────────────────────────────────────────
  build-debug:
    name: Build Debug APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Generate Gradle wrapper jika belum ada
        run: |
          if [ ! -f gradlew ]; then
            echo "gradlew tidak ditemukan, generate otomatis..."
            for i in 1 2 3; do
              gradle wrapper --gradle-version 8.7 && break
              echo "Percobaan $i gagal (kemungkinan services.gradle.org sedang down), retry dalam 15 detik..."
              sleep 15
            done
          fi

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK & CMake
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;26.1.10909125" "cmake;${{ env.CMAKE_VERSION }}" "platforms;android-34" "build-tools;34.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  # ── 4. Build Release (hanya saat push tag v*) ───────────────────
  build-release:
    name: Build & Publish Release
    needs: build-debug
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Generate Gradle wrapper jika belum ada
        run: |
          if [ ! -f gradlew ]; then
            echo "gradlew tidak ditemukan, generate otomatis..."
            for i in 1 2 3; do
              gradle wrapper --gradle-version 8.7 && break
              echo "Percobaan $i gagal (kemungkinan services.gradle.org sedang down), retry dalam 15 detik..."
              sleep 15
            done
          fi

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK & CMake
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;26.1.10909125" "cmake;${{ env.CMAKE_VERSION }}" "platforms;android-34" "build-tools;34.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > polyglue-release.keystore

      - name: Buat keystore.properties dari secrets
        run: |
          cat > keystore.properties << EOF
          storeFile=polyglue-release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build release APK & AAB
        run: ./gradlew assembleRelease bundleRelease
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125

      - name: Hapus keystore & properties (jangan sampai ke-cache/artifact)
        if: always()
        run: rm -f polyglue-release.keystore keystore.properties

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-builds
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab

      - name: Buat GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          generate_release_notes: true

      - name: Upload ke Firebase App Distribution
        if: ${{ vars.ENABLE_FIREBASE == 'true' }}
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_CREDENTIALS }}
          groups: testers
          file: app/build/outputs/apk/release/app-release.apk
          releaseNotes: "Release ${{ github.ref_name }}"

  # ── 5. SonarCloud (opsional, jalan paralel setelah test) ─────────
  sonarcloud:
    name: SonarCloud Analysis
    needs: test
    if: ${{ vars.ENABLE_SONAR == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Generate Gradle wrapper jika belum ada
        run: |
          if [ ! -f gradlew ]; then
            echo "gradlew tidak ditemukan, generate otomatis..."
            for i in 1 2 3; do
              gradle wrapper --gradle-version 8.7 && break
              echo "Percobaan $i gagal (kemungkinan services.gradle.org sedang down), retry dalam 15 detik..."
              sleep 15
            done
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar --info
